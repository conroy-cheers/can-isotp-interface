[package]
name = "can-isotp-interface"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
keywords = ["can", "can-isotp", "interface", "trait"]
description = "ISO-TP transport traits shared across user-space and kernel backends"
documentation = "https://docs.rs/can-isotp-interface"
repository = "https://github.com/conroy-cheers/can-isotp-interface"
readme = "README.md"
exclude = [".envrc", "*.nix", "flake.lock"]

[features]
default = []
tokio = ["dep:tokio"]
embassy = ["dep:embassy-time"]

[dependencies]
tokio = { version = "1.49", default-features = false, features = ["time"], optional = true }
embassy-time = { version = "0.5", default-features = false, optional = true }

[dev-dependencies]

[package.metadata.docs.rs]
all-features = true
